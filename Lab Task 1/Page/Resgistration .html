<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Design/design.css">
    <title>Student Information</title>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            Student Information
        </div>
        
        <form>
            <div class="form-grid">
                <div class="input-group">
                    <label for="fullName">Full Name (Text)</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your.email@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter secure password" required>
                </div>
                <div class="input-group">
                    <label for="age">Age (Number)</label>
                    <input type="number" id="age" placeholder="Enter your age" required>
                </div>

                <div class="input-group">
                    <label for="expDate">Experiment Date</label>
                    <input type="date" id="expDate" required>
                </div>
                <div class="input-group">
                    <label for="phone">Phone Number (Tel)</label>
                    <input type="tel" id="phone" placeholder="+880 XXXX XXXXXX" required>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">SUBMIT</button>
                <button type="reset" class="btn-clear">CLEAR</button>
            </div>
        </form>
    </div>

</body>
</html>
