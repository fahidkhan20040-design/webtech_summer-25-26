<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../Design/Style.css">
    <title>Sign In</title>
</head>
<body>
    <div class="container">

        <h1>Patient Sign In Form</h1>

        <form>
            <fieldset>
                <legend> Patient Login Information </legend>
                <table>
                    <tr>
                        <td><label for="username">User name:</label></td>
                        <td><input type="text" id="username" name="username" placeholder="Enter your name" required</td>
                    </tr>
                    <tr>
                        <td><label for="password">Password:</label></td>
                        <td><input type="password" id="password" name="password" placeholder="Enter your password" required</td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remeber"> Remember Me</label>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2">
                            <input type="submit" id="submit" name="submit" value="Sign-in">
                           <input type="reset" id="reset" name="reset" value="reset">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: left; padding-top: 15px;">
                            <label>Don't have an account?</label>
                            <a href="Resgistration .html" style="color: blue;">Register Here</a>
                        </td>
                    </tr>
                </table>
            </fieldset>
        </form>
    </div>
</body>
</html>
