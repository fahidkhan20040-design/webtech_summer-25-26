<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In</title>
    <link rel="stylesheet" href="../Design/Style.css">
    <script src="../JS/Script.js"></script>
</head>
<body>
    <!-- Panda Animation -->
    <div class="panda-wrap">
        <div class="panda">
            <div class="ear-l"></div>
            <div class="ear-r"></div>
            <div class="eye-l"></div>
            <div class="eye-r"></div>
            <div class="nose"></div>
            <div class="paw-l"></div>
            <div class="paw-r"></div>
        </div>
    </div>

    <!-- Form Container -->
    <div class="container" style="position: relative; z-index: 2;">
        <form onsubmit="return validateLogin()">
            <fieldset style="position: relative; margin-top: 15px;">
                <legend style="position: absolute; top: -20px; left: 15px;">SIGN-IN</legend>
                <table style="margin-top: 10px;">
                    <tr>
                        <td><label for="Email">Email address</label></td>
                    </tr>
                    <tr>
                        <td><input type="email" id="Email" name="Email" placeholder="Enter email"></td>
                    </tr>
                    <tr>
                        <td><label for="Password">Password</label></td>
                    </tr>
                    <tr>
                        <td><input type="password" id="Password" name="Password" placeholder="Enter password"></td>
                    </tr>
                </table>
                <div class="form-actions">
                    <input type="submit" value="Login">
                    <input type="reset" value="CLEAR">
                </div>

                <div class="redirect-link">
                    <p>Don't have an account? <a href="Resgistration.html">Signup here</a></p>
                </div>
            </fieldset>
        </form>
    </div>
</body>
</html>
